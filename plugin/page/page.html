<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tanka</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e09a12'/%3E%3Cpath fill='%23fff' d='M11 7h10a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5h-6l-5 4v-4.4A5 5 0 0 1 6 17v-5a5 5 0 0 1 5-5z'/%3E%3Cpath fill='%23e09a12' d='M16 10.2l1.3 3 3 1.3-3 1.3-1.3 3-1.3-3-3-1.3 3-1.3z'/%3E%3C/svg%3E">
<style nonce="__NONCE__">
:root {
  --bg: #f5f2ea; --panel: #fbf9f4; --raised: #ffffff; --bubble: #ece7db; --ink: #1f1d1a; --muted: #6b665c; --faint: #9a9488;
  --line: #e4ded0; --accent: #e09a12; --accent-ink: #251900; --accent-soft: #fbedc9;
  --good: #2f7d4a; --bad: #b3372b; --warn: #a65f00; --dev: #5b4fc4;
  --shadow-sm: 0 1px 2px rgb(40 30 10 / .06); --shadow: 0 2px 6px rgb(40 30 10 / .06), 0 10px 30px rgb(40 30 10 / .06);
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131216; --panel: #18171c; --raised: #211f26; --bubble: #26242c; --ink: #ece9e2; --muted: #a39e94; --faint: #757068;
    --line: #2d2b33; --accent: #f2b52b; --accent-ink: #1d1503; --accent-soft: #3a2f12;
    --good: #5fbf7f; --bad: #ef7466; --warn: #e8a54c; --dev: #a397f5;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .3); --shadow: 0 2px 8px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131216; --panel: #18171c; --raised: #211f26; --bubble: #26242c; --ink: #ece9e2; --muted: #a39e94; --faint: #757068;
  --line: #2d2b33; --accent: #f2b52b; --accent-ink: #1d1503; --accent-soft: #3a2f12;
  --good: #5fbf7f; --bad: #ef7466; --warn: #e8a54c; --dev: #a397f5;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .3); --shadow: 0 2px 8px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .25);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header */
.top { flex: none; display: flex; align-items: center; gap: 14px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; font-size: 18px; flex: none; }
.mark { width: 70%; height: 70%; display: block; }
.mark .b { fill: var(--accent); }
.mark .s { fill: var(--raised); }
.event .head .mark { width: 16px; height: 16px; flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.ws { font-size: 13px; color: var(--muted); padding: 2px 9px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
.ws select { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 4px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; line-height: 1; }
.badge.soft { background: var(--accent-soft); color: var(--ink); }
.spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 0; background: none; cursor: pointer; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.live:hover { background: var(--bubble); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); }
.dot.off { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
.banner { flex: none; margin: 10px 16px 0; background: color-mix(in srgb, var(--bad) 10%, var(--raised)); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 12px; padding: 9px 14px; font-size: 14px; }

/* ---------- chat layout */
#chatwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
#chatwrap.noside { grid-template-columns: minmax(0, 1fr); }
#chatwrap.noside .day, #chatwrap.noside .daytoggle { display: none !important; }
.chat { display: flex; flex-direction: column; min-height: 0; position: relative; }
.scrollwrap { flex: 1; min-height: 0; position: relative; display: flex; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; }
.lane { max-width: 760px; margin: 0 auto; padding: 0 24px; }
.log { display: flex; flex-direction: column; padding-top: 12px; }
.sep { display: flex; align-items: center; gap: 12px; margin: 22px 0 4px; color: var(--faint); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.msg { display: flex; gap: 10px; margin-top: 3px; align-items: flex-start; }
.msg.first { margin-top: 16px; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 16px; }
.avatar.ghost { visibility: hidden; height: 1px; }
.avatar.err { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); font-weight: 800; font-size: 14px; }
.col { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; max-width: min(640px, 86%); }
.who { font-size: 12.5px; color: var(--faint); margin: 0 4px 3px; }
.who strong { color: var(--muted); font-weight: 650; margin-right: 6px; }
.bubble { padding: 9px 14px; border-radius: 18px; background: var(--bubble); overflow-wrap: anywhere; }
.them.first .bubble { border-top-left-radius: 6px; }
.you { justify-content: flex-end; }
.you .col { align-items: flex-end; }
.you .bubble { background: var(--accent); color: var(--accent-ink); white-space: pre-wrap; }
.you.first .bubble { border-top-right-radius: 6px; }
.bubble p { margin: 0; white-space: pre-wrap; }
.bubble > * + * { margin-top: 8px; }
.bubble ul, .bubble ol { margin: 0; padding-left: 20px; }
.bubble li + li { margin-top: 3px; }
.bubble code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, var(--ink) 9%, transparent); padding: 1px 5px; border-radius: 5px; }
.bubble .h { font-weight: 650; }
.bubble.error { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.bubble.dots-b { padding: 0; }
.fxs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fx { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 11px 4px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; max-width: 100%; box-shadow: var(--shadow-sm); }
.fx:hover:not(:disabled) { border-color: var(--accent); }
.fx .k { color: var(--muted); white-space: nowrap; }
.fx .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fx:disabled { opacity: .5; cursor: default; }
.fx.done .x { text-decoration: line-through; color: var(--muted); }
.event .sub { margin: 9px 0 4px; font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.event .fxs { margin-top: 0; }
.event .topics { margin: 2px 0 0; font-size: 14.5px; }
.event.bad::before { background: var(--bad); }
.bubble.drafting { white-space: pre-wrap; }
.event { margin: 18px 0 2px 40px; max-width: min(600px, calc(100% - 40px)); background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 10px 16px; box-shadow: var(--shadow-sm); position: relative; }
.event::before { content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
.event.done::before { background: var(--good); }
.event.quiet::before { background: var(--faint); }
.event .head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.event .head .label { font-weight: 650; color: var(--ink); }
.event .text { margin: 4px 0 0; font-size: 15px; white-space: pre-wrap; }
.event.done .text { color: var(--muted); }
.event .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.state { font-size: 13px; color: var(--muted); margin-top: 5px; }
.state.ok { color: var(--good); }
details.ev { margin-top: 6px; font-size: 13px; }
details.ev summary { cursor: pointer; color: var(--muted); width: max-content; }
details.ev pre { margin: 6px 0 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.welcome { text-align: center; padding-top: 9vh; }
.welcome .big { width: 64px; height: 64px; margin: 0 auto; border-radius: 20px; background: var(--accent-soft); display: grid; place-items: center; font-size: 34px; }
.welcome h2 { margin: 14px 0 6px; font-size: 21px; letter-spacing: -.01em; }
.welcome p { color: var(--muted); max-width: 470px; margin: 0 auto; }
.jump { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 5px 14px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); }
.dots { display: inline-flex; gap: 4px; padding: 14px 16px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-2px); } }

/* ---------- composer */
.composer { flex: none; padding: 6px 24px 16px; }
.composer .lane { padding: 0; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.suggest button { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.suggest button:hover { border-color: var(--accent); }
.box { display: flex; align-items: flex-end; gap: 8px; background: var(--raised); border: 1px solid var(--line); border-radius: 22px; padding: 6px 6px 6px 18px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
.box textarea { flex: 1; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; line-height: 1.45; resize: none; padding: 7px 0; max-height: 168px; }
.box textarea::placeholder { color: var(--faint); }
.send { width: 38px; height: 38px; flex: none; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; transition: opacity .15s, transform .1s; }
.send:disabled { opacity: .28; cursor: default; }
.send:not(:disabled):active { transform: scale(.93); }
.send svg { width: 18px; height: 18px; }
.hint { margin-top: 7px; font-size: 12px; color: var(--faint); text-align: center; }
.hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.hint .err { color: var(--bad); }
.modes { display: flex; gap: 4px; margin-bottom: 8px; }
.modes button { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 3px 13px; font-size: 13px; cursor: pointer; color: var(--muted); }
.modes button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.modes button.dev[aria-checked="true"] { background: var(--dev); border-color: var(--dev); color: #fff; }
.box.dev { border-color: color-mix(in srgb, var(--dev) 55%, var(--line)); }
.box.dev:focus-within { border-color: var(--dev); box-shadow: 0 0 0 4px color-mix(in srgb, var(--dev) 18%, transparent), var(--shadow); }
.box.dev .send { background: var(--dev); color: #fff; }
.msg.dev .bubble { background: color-mix(in srgb, var(--dev) 13%, var(--bubble)); }
.avatar.dev { background: color-mix(in srgb, var(--dev) 22%, transparent); font-size: 15px; }
.you.dev .bubble { background: var(--dev); color: #fff; }
.who .to { color: var(--dev); font-weight: 650; }

/* ---------- your day */
.day { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 20px 28px; }
.day-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.day-h h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.day-h .date { color: var(--muted); font-size: 13px; }
.summary { margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
.summary b { color: var(--warn); font-weight: 650; }
.sec { margin: 20px 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.rem { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 12px; margin: 0 -10px; }
.rem:hover { background: var(--bubble); }
.rem.due { background: color-mix(in srgb, var(--accent) 13%, transparent); }
.rem .time { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 15px; line-height: 1.25; }
.rem .time small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
.rem.due .time small { color: var(--warn); font-weight: 650; }
.rem.done .time, .rem.done .t { color: var(--faint); }
.rem.done .t { text-decoration: line-through; }
.rem .t { font-size: 14px; line-height: 1.4; }
.rem .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.rem .m:empty { display: none; }
.acts-side { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.rem:hover .acts-side, .rem:focus-within .acts-side, .rem.due .acts-side { opacity: 1; }
.icon { min-width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 650; display: inline-grid; place-items: center; padding: 0 5px; }
.icon:hover { background: var(--raised); color: var(--ink); box-shadow: var(--shadow-sm); }
.icon.ok:hover { color: var(--good); }
.icon svg { width: 16px; height: 16px; }
.topic { margin: 0 -10px 4px; padding: 7px 10px; border-radius: 12px; }
.topic-h { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; min-height: 28px; }
.topic-h .n { font-size: 12px; color: var(--muted); font-weight: 500; }
.topic-h .icon { margin-left: auto; opacity: 0; }
.topic:hover .topic-h .icon, .topic:focus-within .topic-h .icon { opacity: 1; }
.checks { list-style: none; margin: 2px 0 0; padding: 0; }
.checks li { border-radius: 8px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; font-size: 14px; line-height: 1.4; }
.checks input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; flex: none; margin: 1px 0 0; border: 1.5px solid var(--faint); border-radius: 6px; display: grid; place-items: center; cursor: pointer; background: var(--raised); transition: background .15s, border-color .15s; }
.checks input::after { content: "✓"; font-size: 12px; font-weight: 800; color: var(--accent-ink); transform: scale(0); transition: transform .12s; }
.checks input:checked { background: var(--accent); border-color: var(--accent); }
.checks input:checked::after { transform: scale(1); }
.checks li.done label > span { color: var(--faint); text-decoration: line-through; }
.tag { font-size: 11.5px; padding: 0 7px; border-radius: 99px; background: var(--bubble); color: var(--muted); white-space: nowrap; font-weight: 500; }
.rem:hover .tag { background: var(--raised); }
.tag.found { background: var(--accent-soft); color: var(--ink); }
details.donehist { margin-top: 14px; }
details.donehist summary { cursor: pointer; font-size: 13px; color: var(--muted); width: max-content; }
.side-empty { text-align: center; color: var(--muted); padding: 36px 6px; font-size: 14px; }
.side-empty .big { font-size: 30px; }
.side-empty strong { display: block; color: var(--ink); margin: 8px 0 2px; font-size: 15px; }
.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 35% { background: color-mix(in srgb, var(--accent) 32%, transparent); } 100% { background: transparent; } }
.daytoggle, .scrim { display: none; }
@media (hover: none) { .acts-side, .topic-h .icon { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i, .flash { animation: none; } }

/* ---------- other tabs */
#view { flex: 1; overflow-y: auto; }
.page { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; overflow-wrap: anywhere; box-shadow: var(--shadow-sm); }
.card.unseen { border-left: 3px solid var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meta { color: var(--muted); font-size: 13px; }
.chip { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.chip.ok { border-color: var(--good); color: var(--good); }
.chip.no { border-color: var(--bad); color: var(--bad); }
.card .text { margin: 6px 0; font-size: 16px; white-space: pre-wrap; }
.evidence { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 9px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.ghost { border: 1px solid transparent; background: none; color: var(--muted); padding: 3px 9px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.ghost:hover { background: var(--bubble); color: var(--ink); }
.ghost[aria-pressed="true"] { color: var(--ink); background: var(--accent-soft); border-color: var(--accent); }
.empty { color: var(--muted); padding: 24px 4px; }
.problem { color: var(--bad); }
.warning { color: var(--warn); }
.note-banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0; font-family: var(--mono); font-size: 12.5px; }
.timeline li { padding: 3px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; }
.timeline li.fail { color: var(--bad); }
.timeline li.prompt { color: var(--ink); font-weight: 600; }
.timeline li.fire { color: var(--accent); font-weight: 600; }
details summary { cursor: pointer; color: var(--muted); }
pre.section { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; }
dl.health { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
dl.health dt { color: var(--muted); }
dl.health dd { margin: 0; }

/* ---------- boards */
.board-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.board-h h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.board-h select { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 3px 8px; }
.filter { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 3px 10px; min-width: 180px; }
.group { margin: 14px 0 6px; }
.group-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 650; font-size: 15px; margin-bottom: 6px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); box-shadow: var(--shadow-sm); }
table.board { border-collapse: collapse; width: 100%; font-size: 14px; }

}

// ------------------------------------------------------------ the composer (built once, never re-rendered)
const say = $("say"), sendBtn = $("send");
function grow() { say.style.height = "auto"; say.style.height = Math.min(say.scrollHeight, 168) + "px"; }
function suggestions(sc) {
  const all = ui.mode === "dev" ? T.devSuggest : active(sc).flatMap(([, s]) => s.suggest || []);
  const sig = (sc ? sc.scope : "") + ui.mode + JSON.stringify(all);
  if (sig === ui.suggestSig) return;
  ui.suggestSig = sig;
  $("suggest").replaceChildren(...all.map(([text, now]) => el("button", { type: "button", on: { click: () => {
    say.value = text; grow(); updateComposer();
    if (now) send(); else { say.focus(); say.setSelectionRange(text.length, text.length); }
  } } }, text.trim())));
}
function updateComposer() {
  const sc = current(), busy = !!(sc && sc.busy) || ui.sending;
  sendBtn.disabled = busy || !say.value.trim();
  const name = nameOf(sc), dev = ui.mode === "dev";
  say.placeholder = busy ? T.placeholderBusy(sc && sc.busy_mode === "dev" ? T.devName : name) : dev ? T.devPlaceholder(name) : T.placeholder(name);
  say.setAttribute("aria-label", dev ? T.devPlaceholder(name) : T.placeholder(name));
  say.closest(".box").classList.toggle("dev", dev);
  for (const b of $("modes").children) b.setAttribute("aria-checked", String(b.dataset.mode === ui.mode));
  $("modes").lastChild.firstChild.textContent = T.devName;
  $("modes").firstChild.textContent = name;
  $("helloT").textContent = T.hello(name);
  $("helloP").textContent = [T.helloText, ...active(sc).map(([, s, mod]) => s.hello ? s.hello(sc, mod) : "")].filter(Boolean).join(" ");
  $("typingName").textContent = sc && sc.busy_mode === "dev" ? T.devName : name;
  suggestions(sc);
  $("suggest").hidden = !!say.value.trim() || busy;
  $("left").textContent = dev && sc && sc.dev ? T.devHint(sc.dev.per_message_usd, sc.dev.left_usd)
    : T.hintCost + (sc && sc.chat_left != null && sc.chat_left < 10 ? T.left(sc.chat_left) : "");
}
async function send(textArg) {
  const typed = typeof textArg !== "string", sc = current(), text = (typed ? say.value : textArg).trim();
  if (!sc || !text || ui.sending || sc.busy) return;
  ui.sending = true; ui.stick = true;
  $("cmsg").textContent = "";
  updateComposer();
  try {
    await api("/api/chat", { scope: sc.scope, text, mode: ui.mode });
    if (typed) { say.value = ""; grow(); }
  } catch (e) { $("cmsg").textContent = " · " + e.message; }
  ui.sending = false;
  await refresh();
  say.focus();
}
Tanka.send = text => send(text);
// A row's button writes its message here for the user to read, change and send: it never sends by itself,
// because the row's values were written from what a model read.
Tanka.compose = text => {
  ui.tab = "chat"; ui.showDay = false; remember("tanka.tab", "chat");
  render();
  say.value = String(text).slice(0, 1000); grow(); updateComposer();
  say.focus(); say.setSelectionRange(say.value.length, say.value.length);
};
Tanka.go = tab => { ui.tab = tab; ui.showDay = false; remember("tanka.tab", tab); render(); };
function setupComposer() {
  // Who answers: the workspace's assistant, or dev. It starts on the assistant every time the page opens,
  // so dev (the strong model) is never used without choosing it.
  const modeBtn = (mode, label, cls, title) => el("button", { type: "button", role: "radio", class: cls, "data-mode": mode, title,
    "aria-checked": String(ui.mode === mode), on: { click: () => { ui.mode = mode; ui.suggestSig = ""; updateComposer(); say.focus(); } } }, label);
  $("modes").setAttribute("aria-label", T.modes);
  $("modes").append(modeBtn("tanka", "Tanka", "", ""), modeBtn("dev", el("span", {}, T.devName), "dev", T.devTitle));
  sendBtn.append(svg(ICON.send));
  sendBtn.setAttribute("aria-label", T.send);
  sendBtn.title = T.send;
  const [k1, t1, k2, t2] = T.hint;
  $("hint").append(el("kbd", {}, k1), t1, el("kbd", {}, k2), t2, el("span", { id: "left" }), el("span", { class: "err", id: "cmsg" }));
  say.addEventListener("input", () => { grow(); updateComposer(); });
  say.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  sendBtn.addEventListener("click", send);
  $("jump").textContent = T.newMessages;
  $("jump").addEventListener("click", scrollEnd);
  scroller().addEventListener("scroll", () => { if (nearEnd()) $("jump").hidden = true; });
  $("daytoggle").addEventListener("click", () => { ui.showDay = true; render(); });
  $("scrim").addEventListener("click", () => { ui.showDay = false; render(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.showDay) { ui.showDay = false; render(); } });
}

// ------------------------------------------------------------ health
function healthView(sc) {
  const h = ui.state.health;
  const yes = (ok, a, b) => el("span", { class: "chip " + (ok ? "ok" : "no") }, ok ? a : b);
  const daemon = h.daemon_pid ? yes(h.daemon_ok, T.daemonOk(h.daemon_pid, h.daemon_seen) + (h.daemon_stale ? T.daemonOld : ""), T.daemonStale(h.daemon_pid))
    : yes(false, "", T.daemonNo);
  const mods = active(sc).map(([n]) => n);
  return [el("div", { class: "card" }, el("dl", { class: "health" },
    el("dt", {}, T.hDaemon), el("dd", {}, daemon),
    el("dt", {}, T.hRuns), el("dd", {}, sc && sc.spent_today ? T.runs(sc.spent_today[1], sc.spent_today[0]) : "—"),
    el("dt", {}, T.hModules), el("dd", {}, mods.length ? mods.join(", ") : T.noModules),
    (h.rows || []).flatMap(r => [el("dt", {}, r.label), el("dd", {}, r.ok == null ? r.text : yes(r.ok, r.text, r.text))])))];
}

// ------------------------------------------------------------ frame
function tabsOf(sc) {
  const tabs = [{ id: "chat", label: T.chat }];
  for (const [name, spec] of active(sc)) for (const t of spec.tabs || []) tabs.push({ ...t, module: name });
  tabs.push({ id: "health", label: T.health });
  return tabs;
}
function badgeOf(sc, t) {
  if (t.id === "chat") return active(sc).reduce((a, [, s, mod]) => a + (s.attention ? s.attention(sc, mod) || 0 : 0), 0);
  return t.badge ? t.badge(sc, modOf(sc, t.module)) || 0 : 0;
}

function header(sc) {
  const scopes = ui.state ? ui.state.scopes : [];
  const wsSig = scopes.map(s => s.scope).join("|") + "#" + (sc ? sc.scope : "");
  if (wsSig !== ui.wsSig) {  // rebuilt only when it changes, so an open dropdown is not closed under the pointer
    ui.wsSig = wsSig;
    $("ws").hidden = !sc;
    $("ws").replaceChildren(scopes.length > 1
      ? el("select", { "aria-label": T.workspace, on: { change: e => { ui.scope = e.target.value; ui.sideSig = ""; remember("tanka.scope", ui.scope); render(); } } },
          scopes.map(s => el("option", { value: s.scope, selected: sc && s.scope === sc.scope }, s.name && s.name !== s.scope ? `${s.name} · ${s.scope}` : s.scope)))
      : (sc ? sc.scope : ""));
  }
  const tabs = tabsOf(sc);
  if (!tabs.some(t => t.id === ui.tab)) ui.tab = "chat";
  const tabSig = tabs.map(t => t.id).join("|");
  if (tabSig !== ui.tabSig) {
    ui.tabSig = tabSig;
    $("tabs").replaceChildren(...tabs.map(t => el("button", { role: "tab", type: "button", "data-tab": t.id,
      on: { click: () => { ui.tab = t.id; ui.showDay = false; remember("tanka.tab", t.id); render(); if (t.id === "chat") say.focus(); } } },
      el("span", {}, t.label), el("span", { class: "badge", hidden: true }))));
  }
  let total = 0;
  for (const b of $("tabs").children) {
    const t = tabs.find(x => x.id === b.dataset.tab), count = t ? badgeOf(sc, t) : 0, badge = b.lastChild;
    total += count;
    b.setAttribute("aria-selected", String(ui.tab === b.dataset.tab));
    badge.hidden = !count;
    badge.textContent = String(count);
  }
  const h = ui.state && ui.state.health;
  const [cls, label, title] = ui.error ? ["off", T.liveOff, ui.error]
    : !h ? ["warn", T.loading, ""]
    : !h.daemon_ok ? ["warn", T.liveNoDaemon, T.noDaemonTitle]
    : ["", T.live, T.liveTitle(new Date(ui.lastOk).toLocaleTimeString(LOCALE, HM))];
  $("dot").className = "dot " + cls;
  $("liveLbl").textContent = label;
  $("live").title = title;
  $("banner").hidden = !ui.error;
  $("banner").textContent = ui.error ? T.unreachable(ui.error) : "";
  $("brandName").textContent = sc ? nameOf(sc) : "Tanka";
  document.title = (total ? `(${total}) ` : "") + (sc ? nameOf(sc) : "Tanka");
}

function render() {
  const sc = current();
  header(sc);
  const chatting = !!(ui.state && sc && ui.tab === "chat");
  $("chatwrap").hidden = !chatting;
  $("view").hidden = chatting;
  if (chatting) { chatView(sc); return; }
  const kids = [];
  if (!ui.state) kids.push(el("p", { class: "empty" }, T.loading));
  else if (!sc) kids.push(el("p", { class: "empty" }, T.noScope));
  else if (ui.tab === "health") kids.push(...healthView(sc));
  else {
    const t = tabsOf(sc).find(x => x.id === ui.tab);
    // A tab with a sig is rebuilt only when it changes, so an input on it keeps its focus between polls.
    const sig = t && t.sig ? JSON.stringify([sc.scope, t.id, t.sig(sc, modOf(sc, t.module))]) : null;
    if (sig && sig === ui.viewSig && !$("view").hidden) return;
    ui.viewSig = sig;
    if (t && t.render) kids.push(...[].concat(t.render(sc, modOf(sc, t.module))));
  }
  if (ui.tab === "health" || !kids.length) ui.viewSig = null;
  $("view").replaceChildren(el("div", { class: "page" }, kids));
}

let lastFetch = 0;
async function refresh() {
  if (ui.fetching) return;
  ui.fetching = true;
  lastFetch = Date.now();
  try {
    ui.state = await api("/api/state");
    const sc = current();
    for (const [, spec, mod] of active(sc)) if (spec.refresh) await spec.refresh(sc, mod);
    ui.error = "";
    ui.lastOk = Date.now();
  } catch (e) { ui.error = e.message; }
  ui.fetching = false;
  render();
}

// Every 5 s; fast while it answers, so the draft streams in; every 15 s in a background tab, so the title still counts.
function pace() {
  const sc = current();
  if (document.hidden) return 15000;
  return (sc && sc.busy) || ui.sending ? 700 : 5000;
}
$("live").addEventListener("click", () => { ui.tab = "health"; remember("tanka.tab", "health"); render(); });
setupComposer();
setInterval(() => { if (Date.now() - lastFetch >= pace()) refresh(); tick(); }, 250);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh().then(() => { if (ui.tab === "chat" && window.matchMedia("(hover: hover)").matches) say.focus(); });
</script>
