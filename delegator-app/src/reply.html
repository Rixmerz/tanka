<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
:root{--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#1a1a1a);--mut:var(--color-text-secondary,#6b6b6b);--line:var(--color-border-primary,#e3e3e3);--acc:#6c5ce7}
@media (prefers-color-scheme:dark){:root{--bg:var(--color-background-primary,#1f1f1f);--fg:var(--color-text-primary,#ececec);--mut:var(--color-text-secondary,#a0a0a0);--line:var(--color-border-primary,#333)}}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg);font:15px/1.5 system-ui,sans-serif}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;margin-bottom:6px}#who{font-weight:600;text-transform:capitalize}
.pill{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.pill.done{background:color-mix(in srgb,#2ecc71 18%,transparent);color:#27ae60}.pill.error{background:color-mix(in srgb,#e74c3c 18%,transparent);color:#e74c3c}
#task{color:var(--mut);font-size:13px;margin:0 0 10px}#body{overflow-wrap:anywhere}#body pre{overflow-x:auto;padding:10px;border-radius:8px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.dots::after{content:"…";animation:d 1.2s steps(3) infinite}@keyframes d{0%{content:"."}33%{content:".."}66%{content:"..."}}
footer{margin-top:10px;font-size:11px;color:var(--mut)}
</style></head><body><div class="card">
<header><span id="who">🤖 especialista</span><span id="state" class="pill">trabajando</span></header>
<p id="task"></p><div id="body"><span class="dots">Pensando</span></div><footer id="id"></footer>
</div><script type="module">/*UI*/</script></body></html>
